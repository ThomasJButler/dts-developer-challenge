# Project metadata is intentionally minimal — we use plain requirements.txt
# for installs (see CLAUDE.md) and only need this file for tool config.

[tool.pytest.ini_options]
# Pytest discovers tests from this directory. addopts keeps reports terse
# and treats the project root as importable so `from app.main import app`
# works without a setup.py shim. --cov-fail-under enforces the coverage
# floor stated in plans/backend.md (>=85% on routers and services).
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["."]

[tool.coverage.run]
# Measure the app code only. Migrations and tests are excluded — the
# migration is one-time DDL (covered by the alembic round-trip we run
# manually), and counting tests as covered would be circular.
source = ["app"]
omit = [
    "app/__init__.py",
    "app/db/__init__.py",
    "app/schemas/__init__.py",
    "app/routers/__init__.py",
    "app/services/__init__.py",
    "app/db/repositories/__init__.py",
]

[tool.coverage.report]
# Don't penalise pure import-time guards that we can't reach in tests.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
# Match Python 3.11 (CLAUDE.md's documented floor). The default line length
# of 88 is fine for this codebase.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A modest selection: pyflakes (F), pycodestyle errors+warnings (E, W),
# import ordering (I), bugbear (B), and pyupgrade (UP). Avoids the noisier
# rule families until the code is stable enough to benefit from them.
select = ["E", "W", "F", "I", "B", "UP"]
